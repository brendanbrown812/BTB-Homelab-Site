services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-btb}
      POSTGRES_USER: ${POSTGRES_USER:-btb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - btb_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-btb} -d ${POSTGRES_DB:-btb}"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-btb}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-btb}
      LOCAL_CREATE_SCHEMA: "false"
    depends_on:
      db: { condition: service_healthy }
    ports: ["8000:8000"]
  web:
    build: .
    restart: unless-stopped
    depends_on: [api]
    ports: ["3007:3000"]
volumes:
  btb_postgres:
